name: Build and Release

on:
  push:
    tags: ['v*'] # Only runs when you push a tag like v1.0

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        # $env:VCPKG_INSTALLATION_ROOT is automatically provided by GitHub Actions
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Create Installer (CPack)
        run: |
          cd build
          cpack -C Release

      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}